services:
  - type: web
    name: medical-assistant-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medical-assistant-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://medical-health-assist.vercel.app,https://*.vercel.app,http://localhost:4200

databases:
  - name: medical-assistant-db
    databaseName: medical_assistant_db
    user: postgres
    plan: free
