<!-- Floating Help Button -->
<button class="help-btn" [class.active]="isOpen" (click)="toggleChat()" title="Chat with AI Assistant" aria-label="Toggle AI Assistant Chat">
  <i class="bi" [ngClass]="isOpen ? 'bi-x-lg' : 'bi-chat-dots-fill'"></i>
  <span class="btn-pulse" *ngIf="!isOpen"></span>
</button>

<!-- Overlay -->
<div class="chat-overlay" [class.visible]="isOpen" (click)="closeChat()"></div>

<!-- Right Side Chat Panel -->
<div class="chat-panel" [class.open]="isOpen">
  <!-- Header -->
  <div class="chat-header">
    <div class="header-info">
      <div class="bot-avatar">
        <i class="bi bi-robot"></i>
      </div>
      <div>
        <h6 class="mb-0">Medical AI Assistant</h6>
        <small class="header-status"><span class="status-dot"></span> Online &bull; Gemini AI</small>
      </div>
    </div>
    <button class="btn-close-chat" (click)="closeChat()" aria-label="Close chat">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Chat Body -->
  <div class="chat-body">
    <!-- Messages -->
    <div *ngFor="let msg of messages" class="message-row" [ngClass]="msg.sender">
      <!-- Bot avatar -->
      <div *ngIf="msg.sender === 'bot'" class="msg-avatar">
        <i class="bi bi-robot"></i>
      </div>

      <div class="message-bubble" [ngClass]="msg.sender">
        <div class="msg-text">{{ msg.text }}</div>
        <div class="msg-time">{{ msg.timestamp | date:'shortTime' }}</div>
      </div>

      <!-- User avatar -->
      <div *ngIf="msg.sender === 'user'" class="msg-avatar user-avatar">
        <i class="bi bi-person-fill"></i>
      </div>
    </div>

    <!-- Typing indicator -->
    <div *ngIf="isLoading" class="message-row bot">
      <div class="msg-avatar">
        <i class="bi bi-robot"></i>
      </div>
      <div class="message-bubble bot typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Interactive Quick Suggestions -->
  <div class="chat-suggestions-bar" *ngIf="messages.length <= 3 && !isLoading">
    <div class="suggestions-scroll">
      <button
        *ngFor="let s of suggestions"
        type="button"
        class="suggestion-pill"
        (click)="sendSuggested(s.text)">
        {{ s.label }}
      </button>
    </div>
  </div>

  <!-- Input Area (Fixed and always visible on mobile) -->
  <div class="chat-input-wrapper">
    <div class="chat-input">
      <textarea
        #chatInput
        class="chat-text-input"
        [(ngModel)]="userMessage"
        placeholder="Type a message or question..."
        (keydown)="onKeyDown($event)"
        (input)="autoResize($event)"
        [disabled]="isLoading"
        rows="1"></textarea>
      <button class="send-btn" (click)="sendMessage()" [disabled]="!userMessage.trim() || isLoading" aria-label="Send message">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
  </div>
</div>
