spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:./backend/.env[.properties]

server.port=${SERVER_PORT}

spring.application.name=promptengineering

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.ai.openai.api-key=${GOOGLE_API_KEY}
spring.ai.openai.base-url=${AI_BASE_URL}
spring.ai.openai.chat.options.model=${AI_MODEL}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE}
spring.ai.openai.chat.options.max-tokens=${AI_MAX_TOKENS}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ORIGIN}

logging.level.com.medical=DEBUG
