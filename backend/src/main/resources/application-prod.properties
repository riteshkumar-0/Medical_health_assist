server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Health Check & Actuator for Render / Cloud monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Google Gemini AI Configuration
spring.ai.openai.api-key=${GOOGLE_API_KEY:${GROQ_API_KEY}}
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.options.model=${AI_MODEL:gemini-3.5-flash-lite}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE:0.4}
spring.ai.openai.chat.options.max-tokens=${AI_MAX_TOKENS:800}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ORIGIN:https://medical-health-assist.vercel.app,https://*.vercel.app,http://localhost:4200}

logging.level.com.medical=INFO
